[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisx-agent"
version = "0.2.0"
description = "Autonomous AI-powered cybersecurity penetration testing agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Aegisx Team" },
]
keywords = ["security", "pentest", "cybersecurity", "owasp", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pluggy>=1.4.0",
    "pyyaml>=6.0.1",
    "aiosqlite>=0.20.0",
    "tldextract>=5.1.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
aegisx = "aegisx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisx"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts, hardcoded fixture secrets, and
# long data lines (URLs, payloads, expected strings). urllib is only
# pointed at the ephemeral localhost dashboard port.
"tests/*" = ["S101", "S106", "E501", "E402", "S310"]
# Typer's declarative API requires Option()/Argument() calls in defaults
"src/aegisx/cli.py" = ["B008", "B904"]
# Knowledge-base tables carry long OWASP/CWE description strings
"src/aegisx/knowledge/*" = ["E501"]
# Scanner/exploit payload tables and report templates contain long
# literal strings that must not be wrapped
"src/aegisx/scanners/*" = ["E501"]
"src/aegisx/exploits/*" = ["E501"]
"src/aegisx/reporters/*" = ["E501"]
# The embedded dashboard page carries long HTML/CSS/JS lines that must
# not be wrapped; the handler's broad except is a deliberate crash guard
"src/aegisx/dashboard.py" = ["E501", "SIM105", "S110"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
